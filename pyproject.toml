[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otaman-adapters"
version = "0.2.0"
description = "Otaman harness drivers: per-runtime skill registration adapters"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.3",  # ce-lint-standard: pin exact, fleet-uniform (F182 — matches otaman-core)
]

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
