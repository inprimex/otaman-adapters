# CLA caller — copy verbatim to .github/workflows/cla.yml in each CE repo.
# All logic lives in the reusable workflow in otaman-deploy; see
# otaman-deploy/docs/cla/README.md for the rollout runbook.
# Requires repo secret CLA_SIGNATURES_TOKEN (PAT scoped to inprimex/cla-signatures).
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    uses: inprimex/otaman-deploy/.github/workflows/cla.yml@main
    secrets:
      CLA_SIGNATURES_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
